spring.application.name=CRRSBatch

# server port number
server.port=4041

# Oracle DB connection (PDB)
spring.datasource.url=jdbc:p6spy:oracle:thin:@localhost:1521/ORCLPDB
spring.datasource.username=DNGARIKIPATI
spring.datasource.password="Mar20252026@"
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver

# Logging
logging.level.root=WARN
logging.config=classpath:log4j2-spring.xml

spring.batch.job.repository.type=map
spring.datasource.autoconfiguration.enabled=false

# JPA-Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=DNGARIKIPATI

spring.batch.job.enabled=false

# ==============================
# Spring Batch Metadata
# ==============================
spring.batch.jdbc.initialize-schema=always

# Use Oracle-friendly isolation level for job instance creation
spring.batch.jdbc.isolation-level-for-create=READ_COMMITTED

# Use default table prefix (BATCH_) or customize if you want schema separation
spring.batch.jdbc.table-prefix=BATCH_

# By default Spring Boot tries to launch ALL jobs at startup.
# Disable automatic job execution unless you explicitly trigger

# ==============================
# Logging (optional)
# ==============================
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate.SQL=WARN
